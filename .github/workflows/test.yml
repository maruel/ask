# Run cross-platform checks with shared setup, coverage and generation gates.

on: [push, pull_request]
name: Run checks
jobs:
  # Signals, terminal handling and CLI filenames need runtime coverage on each OS.
  check:
    name: "check: ${{matrix.os}}"
    runs-on: "${{matrix.os}}"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: x
    steps:
      - name: Turn off git core.autocrlf
        if: matrix.os == 'windows-latest'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: "apt-get install bubblewrap"
        if: matrix.os == 'ubuntu-latest'
        run: |
          # The runner image ships a stale apt index; refresh it or the package
          # install fails with 404 on superseded versions.
          sudo apt-get update
          sudo apt-get install bubblewrap
          # According to https://etbe.coker.com.au/2024/04/24/ubuntu-24-04-bubblewrap/
          echo "abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }" | sudo tee /etc/apparmor.d/bwrap
          sudo systemctl reload apparmor
      - name: "Check: make test"
        if: always()
        run: make test
        # Don't send code coverage if anything failed to reduce spam.
      - uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
      - name: "Check: tree is clean"
        if: always()
        run: |
          # Nothing should have changed in the tree up to that point and no
          # unsuspected file was created.
          TOUCHED=$(git status --porcelain)
          if ! test -z "$TOUCHED"; then
            echo "Oops, something touched these files, please cleanup:"
            echo "$TOUCHED"
            git diff
            false
          fi
      - run: make verify
        if: always()
      - name: "Check: go generate doesn't modify files"
        if: always()
        run: |
          go generate ./...
          # Also test for untracked files.
          TOUCHED=$(git status --porcelain)
          if ! test -z "$TOUCHED"; then
            echo "go generate created these files, please fix:"
            echo "$TOUCHED"
            false
          fi

  codeql:
    name: "codeql: ${{matrix.os}}"
    runs-on: "${{matrix.os}}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
